name: CI

# A content repository: no service, no suite, no image. What CI owes it is the one check that
# guards the failure that cannot be undone — a committed secret is compromised the moment it
# lands, whatever kind of repository it lands in. Same shape as micro-brand, which is the
# repository this one is modelled on.
#
# AND THE VERIFIER — added late, and the lateness had a cost. This repository ran only hygiene
# while micro-brand's CI comment already warned that a verifier nobody runs lets the record go
# stale. It did exactly that here: three favicons sat on disk with no manifest entry while the
# README claimed every file is recorded, and the 32px one carried corner strays the flat-asset
# rule refuses — invisible for the whole life of the repo, found only when the Aetherholm assets
# run audited its precedents. verify.py on every push is what makes the claim self-enforcing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    with:
      require-dockerignore: false
    permissions:
      contents: read

  verify:
    name: verify.py
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      # BEFORE the run, not after, and it needs no images or keys. `check_parity` compares sets to
      # each other and there has been one set on disk since the Qwen challenger was withdrawn, so
      # it is DORMANT — it returns clean because it was handed one document, not because it looked
      # and found nothing. `--self-test` hands the real function two-set fixtures with a
      # deliberately broken asset and fails if it stays green, which is the difference between
      # "nothing is wrong" and "nothing is looking". The verifier's own exit code cannot tell them
      # apart, and a check that lost its operand is this estate's most-repeated defect.
      - name: the cross-set guard still fails when broken
        run: python3 verify.py --self-test
      - run: python3 verify.py
